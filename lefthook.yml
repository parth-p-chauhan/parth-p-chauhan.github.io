# yaml-language-server: $schema=https://lefthook.dev/schema.json
pre-commit:
  jobs:
    - name: lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: pnpm exec vp lint --fix {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,md,yml,yaml}"
      run: pnpm exec vp fmt --write {staged_files}
      stage_fixed: true
